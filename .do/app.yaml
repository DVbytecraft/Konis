# ============================================================
# KONIS — DigitalOcean App Platform Spec
# Documentation : https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Architecture :
#   - konis   : Django 5.2 + Gunicorn  (port 8000)  → route /api/
#   - konis2  : Next.js 14 standalone  (port 3000)  → route /  (tout le reste)
#   - db      : PostgreSQL managé      (DATABASE_URL injecté automatiquement)
#   - redis   : Redis managé           (REDIS_URL injecté automatiquement)
#
# Flux de données :
#   Browser → /api/* → DO LB → konis (Django)   : auth, tickets, API métier
#   Browser → /*     → DO LB → konis2 (Next.js) : UI, assets statiques
#   Next.js (SSR)    → BACKEND_URL               : appels serveur → Django
#
# Secrets à générer :
#   DJANGO_SECRET_KEY   : python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
#   INTERNAL_API_SECRET : openssl rand -hex 32
# ============================================================

name: konis
region: fra

# ── Routage HTTP (ingress) ─────────────────────────────────────────────────────
# Ordre : règle la plus spécifique en premier.
# /api/* → backend Django (auth, API, admin, health, tickets)
# /*     → frontend Next.js (UI, pages, assets statiques)
# DO ne strip pas le préfixe → Django reçoit /api/... tel quel.

ingress:
  rules:
    - component:
        name: konis
      match:
        path:
          prefix: /api
    - component:
        name: konis2
      match:
        path:
          prefix: /

# ── Services ───────────────────────────────────────────────────────────────────

services:

  # ── Backend Django/Gunicorn ──────────────────────────────────────────────────
  - name: konis
    dockerfile_path: Dockerfile.prod
    source_dir: .
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs

    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: konis.settings.prod
        scope: RUN_AND_BUILD_TIME

      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "TO_FILL_GENERATE_WITH_DJANGO_COMMAND"

      # Hostname public de l'app (App Platform → Settings → Domains)
      - key: DJANGO_ALLOWED_HOSTS
        value: "konis-idi4i.ondigitalocean.app"

      # DATABASE_URL injecté automatiquement par le composant "db" ci-dessous
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}

      # REDIS_URL injecté automatiquement par le composant "redis" ci-dessous
      - key: REDIS_URL
        value: ${redis.REDIS_URL}

      # Same-origin (frontend et backend sur même domaine) → CORS non requis,
      # mais gardé pour la bonne pratique et les appels cross-origin éventuels.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://konis-idi4i.ondigitalocean.app"

      # Obligatoire Django 4.0+ derrière proxy HTTPS (DO load balancer).
      # Sans cette variable → 403 sur toute requête POST/PUT/DELETE.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://konis-idi4i.ondigitalocean.app"

      - key: INTERNAL_API_SECRET
        type: SECRET
        value: "TO_FILL_GENERATE_WITH_OPENSSL"

      # Workers — professional-xs (0.5 vCPU) → 2 workers
      # Formule : (2 × nb_vCPU) + 1
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"

      # Superuser créé au 1er démarrage par entrypoint.sh.
      # Supprimer DJANGO_SUPERUSER_PASSWORD après le 1er déploiement réussi.
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@agrokonis.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        type: SECRET
        value: "TO_FILL_STRONG_PASSWORD"

    health_check:
      http_path: /api/health/
      initial_delay_seconds: 45   # Laisse le temps aux migrations de s'exécuter
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3


  # ── Frontend Next.js standalone ──────────────────────────────────────────────
  - name: konis2
    dockerfile_path: frontend/Dockerfile.prod   # chemin depuis la racine du dépôt
    source_dir: frontend                         # contexte de build = dossier frontend/
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs

    envs:
      # URL backend côté NAVIGATEUR — les appels /api/* vont sur le même domaine.
      # NEXT_PUBLIC_* est baked au build — reconstruire si l'URL change.
      - key: NEXT_PUBLIC_API_URL
        value: "https://konis-idi4i.ondigitalocean.app"
        scope: BUILD_TIME

      # URL backend côté SERVEUR Next.js (SSR, route handlers server-side).
      - key: BACKEND_URL
        value: "https://konis-idi4i.ondigitalocean.app"
        scope: RUN_TIME

      # Même valeur que dans le backend — obligatoire pour le proxy de login SSR
      - key: INTERNAL_API_SECRET
        type: SECRET
        value: "TO_FILL_SAME_AS_BACKEND"

    # Frontend sert depuis "/" → health check sur la racine
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3


# ── Bases de données managées ──────────────────────────────────────────────────

databases:

  - name: db
    engine: PG
    version: "15"
    # db-s-dev-database : ~15$/mois (staging — pas de backups automatiques)
    # db-s-1vcpu-1gb    : ~50$/mois (prod — backups quotidiens inclus)
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
