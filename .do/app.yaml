# ============================================================
# KONIS — DigitalOcean App Platform Spec
# Documentation : https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Architecture :
#   - konis   : Django 5.2 + Gunicorn  (port 8000)  → route /
#   - konis2  : Next.js 14 standalone  (port 3000)  → route /konis2
#   - db      : PostgreSQL managé      (DATABASE_URL injecté automatiquement)
#   - redis   : Redis managé           (REDIS_URL injecté automatiquement)
#
# Générer DJANGO_SECRET_KEY :
#   python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
# Générer INTERNAL_API_SECRET :
#   openssl rand -hex 32
# ============================================================

name: konis
region: fra

# ── Routage HTTP (ingress) ─────────────────────────────────────────────────────
# L'ordre est important : la règle la plus spécifique (/konis2) doit être en premier.
# DO ne strip pas le préfixe — Next.js reçoit /konis2/... → basePath requis côté Next.js.

ingress:
  rules:
    - component:
        name: konis2
      match:
        path:
          prefix: /konis2
    - component:
        name: konis
      match:
        path:
          prefix: /

# ── Services ───────────────────────────────────────────────────────────────────

services:

  # ── Backend Django/Gunicorn ──────────────────────────────────────────────────
  - name: konis
    dockerfile_path: Dockerfile.prod
    source_dir: .
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs

    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: konis.settings.prod
        scope: RUN_AND_BUILD_TIME

      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "TO_FILL_GENERATE_WITH_DJANGO_COMMAND"

      # Hostname DO de l'app — visible dans App Platform → Settings → Domains
      # Ex : konis-idi4i.ondigitalocean.app
      - key: DJANGO_ALLOWED_HOSTS
        value: "konis-idi4i.ondigitalocean.app"

      # DATABASE_URL injecté automatiquement depuis le composant "db" ci-dessous
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}

      # REDIS_URL injecté automatiquement depuis le composant "redis" ci-dessous
      - key: REDIS_URL
        value: ${redis.REDIS_URL}

      # Frontend et backend sont sur le même domaine → CORS same-origin.
      # On le met quand même pour la bonne pratique.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://konis-idi4i.ondigitalocean.app"

      # Obligatoire Django 4.0+ derrière proxy HTTPS (DO load balancer).
      # Sans cette variable → 403 sur l'admin et toute requête POST.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://konis-idi4i.ondigitalocean.app"

      - key: INTERNAL_API_SECRET
        type: SECRET
        value: "TO_FILL_GENERATE_WITH_OPENSSL"

      # Gunicorn workers — professional-xs (0.5 vCPU) → 2 workers
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"

      # Superuser initial — supprime DJANGO_SUPERUSER_PASSWORD après le 1er déploiement
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@agrokonis.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        type: SECRET
        value: "TO_FILL_STRONG_PASSWORD"

    health_check:
      http_path: /api/health/
      initial_delay_seconds: 45
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3


  # ── Frontend Next.js standalone ──────────────────────────────────────────────
  - name: konis2
    dockerfile_path: frontend/Dockerfile.prod   # chemin depuis la racine du dépôt
    source_dir: frontend                         # contexte de build = dossier frontend/
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs

    envs:
      # NEXT_PUBLIC_BASE_PATH : préfixe de route DO → baked au BUILD TIME dans les assets.
      # Doit correspondre exactement au préfixe défini dans ingress.rules ci-dessus.
      # Utilisé par next.config.mjs : basePath: process.env.NEXT_PUBLIC_BASE_PATH || ""
      - key: NEXT_PUBLIC_BASE_PATH
        value: "/konis2"
        scope: BUILD_TIME

      # URL du backend — utilisée côté NAVIGATEUR (appels API directs, impression tickets).
      # NEXT_PUBLIC_* est embarqué au build — reconstruire si l'URL change.
      - key: NEXT_PUBLIC_API_URL
        value: "https://konis-idi4i.ondigitalocean.app"
        scope: BUILD_TIME

      # URL du backend — utilisée côté SERVEUR Next.js (proxy /api/* → Django).
      - key: BACKEND_URL
        value: "https://konis-idi4i.ondigitalocean.app"
        scope: RUN_TIME

      # Même valeur que dans le backend — obligatoire pour le proxy de login
      - key: INTERNAL_API_SECRET
        type: SECRET
        value: "TO_FILL_SAME_AS_BACKEND"

    # Health check sur le préfixe complet (Next.js répond à /konis2 grâce au basePath)
    health_check:
      http_path: /konis2
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3


# ── Bases de données managées ──────────────────────────────────────────────────

databases:

  - name: db
    engine: PG
    version: "15"
    # db-s-dev-database : ~15$/mois (dev/staging — pas de backups automatiques)
    # db-s-1vcpu-1gb    : ~50$/mois (prod — backups quotidiens inclus)
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
