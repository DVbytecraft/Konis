# ============================================================
# KONIS — Configuration Nginx (reverse proxy production)
# Architecture : Browser → Nginx → [Frontend | Backend]
#   /api/*     → backend (Django/Gunicorn) sur port 8000
#   /*         → frontend (Next.js) sur port 3000
# ============================================================

# ── Rate limiting zones ──────────────────────────────────────────────────────
# Zone globale API : 60 requêtes/minute par IP (burst 20)
limit_req_zone $binary_remote_addr zone=api_global:10m rate=60r/m;
# Zone stricte pour login/refresh : 10 requêtes/minute par IP (anti brute-force)
limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=10r/m;

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# Redirection HTTP → HTTPS (décommenter en production avec certificat SSL)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    # Taille max des corps de requête (uploads)
    client_max_body_size 20M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Headers communs pour les proxies
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Auth endpoints (rate limiting strict anti-brute-force) ──────────────
    # Doit être AVANT /api/ pour avoir priorité (location plus spécifique)
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags ~ httponly samesite=strict;
    }

    # ── API Django (rate limiting global) ────────────────────────────────────
    location /api/ {
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        # Cookies et authentification
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags ~ httponly samesite=strict;
    }

    # ── Django Admin (optionnel, restreindre en prod) ───────
    location /admin/ {
        proxy_pass http://backend;
    }

    # ── Static Django (WhiteNoise les sert via /api/) ───────
    location /static/ {
        proxy_pass http://backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Impression tickets/factures ──────────────────────────
    location /ventes/ {
        proxy_pass http://backend;
    }

    # ── Frontend Next.js ─────────────────────────────────────
    location / {
        proxy_pass http://frontend;

        # WebSocket (Next.js HMR en dev — pas nécessaire en prod mais inoffensif)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Fichiers statiques Next.js (_next/static) ────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check ─────────────────────────────────────────
    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }
}
