services:
  db:
    image: postgres:16-alpine
    container_name: konis_db
    environment:
      POSTGRES_DB: konis_db
      POSTGRES_USER: konis_user
      POSTGRES_PASSWORD: konis_password
      PGCLIENTENCODING: UTF8
    ports:
      - "5433:5432"  # 5433 sur l'hôte pour éviter le conflit avec un PostgreSQL local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konis_user -d konis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: konis_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: konis.settings.dev
      DATABASE_URL: postgres://konis_user:konis_password@db:5432/konis_db
      PGCLIENTENCODING: UTF8
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: konis_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3004:3000"  # 3000 pris par un autre projet sur cet hôte
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
